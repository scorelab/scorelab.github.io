---
layout: page
---

<div class="gallery-container">
  <!-- <h1>{{ page.title }}</h1> -->
  <div class="image-grid">
    {% for item in page.items %}
      <div class="grid-item">
        <a href="{{ item.url }}">
          <img src="{{ item.image }}" alt="{{ item.title }}">
        </a>
        <div class="caption">
          <h4>{{ item.title }}</h4>
          <p>{{ item.description }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<style>
.gallery-container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.grid-item {
  text-align: center;
  background: #fafafa;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}
.grid-item img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  transition: transform 0.2s;
}
.grid-item img:hover {
  transform: scale(1.05);
}
.caption h3 {
  margin: 10px 0 5px 0;
  color: #333;
}
.caption p {
  color: #666;
  font-size: 0.9em;
}
</style>
